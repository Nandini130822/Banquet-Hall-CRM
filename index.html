<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Calculator</title>
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calculator">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<style>
:root{
  --bg:#f5f3f0;--card:#fff;--ink:#1d1b1a;--muted:#716b66;--line:#e7e2dc;
  --brand:#7a1f3d;--brand-soft:#f6e9ee;
  --ok:#1d7f47;--ok-bg:#e2f3e8;--warn:#9a5b00;--warn-bg:#fcefd6;--bad:#b3362a;--bad-bg:#fbe4e1;--info:#25609f;--info-bg:#e3edf9;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1013}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- Calculator ---------- */
#calc{position:fixed;inset:0;display:flex;justify-content:center;background:#0e1013;color:#f1f3f6}
.calc-wrap{width:100%;max-width:440px;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.calc-display{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:8px 6px 20px;min-height:150px;overflow:hidden}
.calc-expr{color:#858d99;font-size:22px;min-height:30px;text-align:right;word-break:break-all}
.calc-out{font-size:64px;font-weight:300;line-height:1.1;text-align:right;word-break:break-all;letter-spacing:-.5px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.key{height:clamp(58px,9.6dvh,80px);border:0;border-radius:22px;background:#1b2027;color:#eef1f5;font-size:28px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:filter .08s}
.key:active{filter:brightness(1.45)}
.key.fn{background:#29303a;color:#c7cfd9;font-size:22px}
.key.op{background:#202c34;color:#3cc4b1;font-size:32px}
.key.eq{background:#159b8d;color:#fff;font-size:34px}
.key.zero{grid-column:span 2}

/* ---------- App shell ---------- */
#app{position:fixed;inset:0;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.shell{width:100%;max-width:560px;display:flex;flex-direction:column;height:100%;background:var(--bg);position:relative}
header.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--brand);color:#fff}
.brand{flex:1;min-width:0}
.brand b{font-size:18px;letter-spacing:.3px;display:block}
.brand span{font-size:12px;opacity:.8}
.who{font-size:13px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:99px;white-space:nowrap}
.top .icon-btn{color:#fff;background:rgba(255,255,255,.12)}
main{flex:1;overflow-y:auto;padding:14px 16px 110px;-webkit-overflow-scrolling:touch}
nav.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--brand);font-weight:600}
.tab .dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.fab{position:absolute;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(122,31,61,.35);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab svg{width:26px;height:26px}

/* ---------- Building blocks ---------- */
h1{font-size:22px;margin:2px 0 0}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 14px}
.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--brand-soft);color:var(--brand)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%;margin-top:12px}
.btn svg{width:16px;height:16px}
.link{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;cursor:pointer;padding:4px 0}
.icon-btn{border:0;background:#efebe6;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:18px}
.icon-btn svg{width:18px;height:18px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.b-info{background:var(--info-bg);color:var(--info)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-new{background:var(--brand);color:#fff}
.src{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eeeae5;color:#5c5650}
.src.meta{background:#e6ecfb;color:#2d50a8}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.warn-t{color:var(--warn)}

/* halls */
.halls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hall{border-radius:12px;padding:12px;border:1.5px solid;min-height:92px;text-align:left;background:none;cursor:default;display:flex;flex-direction:column;gap:4px}
.hall[data-act]{cursor:pointer}
.hall .hn{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
.hall .hs{font-size:17px;font-weight:700}
.hall .hd{font-size:12.5px;line-height:1.35}
.hall.free{border-color:#9fd3b2;background:var(--ok-bg);color:var(--ok)}
.hall.hold{border-color:#efc77a;background:var(--warn-bg);color:var(--warn)}
.hall.booked{border-color:#eba59c;background:var(--bad-bg);color:var(--bad)}
.halls.big .hall{min-height:120px}
.halls.big .hall .hs{font-size:20px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer}
.stat b{display:block;font-size:26px;margin-top:2px}
.stat span{font-size:12.5px;color:var(--muted)}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.money div{display:flex;flex-direction:column;gap:3px}
.money span{font-size:12px;color:var(--muted)}
.money b{font-size:16px}

/* bars & tables */
.bar-row{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.bar{height:12px;background:#f1ede8;border-radius:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#d7c3cb;border-radius:6px}
.bar i.b{background:var(--brand)}
.bar-v{font-size:12px;color:var(--muted);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid #f0ece7}
table.t td.n,table.t th.n{text-align:right}
.mini{display:flex;flex-direction:column}
.mini button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;border-top:1px solid #f0ece7;padding:10px 0;text-align:left;cursor:pointer;width:100%}
.mini button:first-child{border-top:0}
.mini small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* leads */
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;font-size:14px;min-width:0}
.toolbar input{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.lead{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.lead.fresh{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.lead-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.lead-top b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-sub{font-size:13px;margin-top:4px}
.lead-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:7px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

/* availability */
.datebar{display:flex;gap:8px;align-items:center;margin:10px 0 4px}
.datebar input{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:15px;background:#fff;min-width:0}
.suggest{margin-top:10px;font-size:13px;background:#faf8f5;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;line-height:1.5}
.suggest button{border:0;background:var(--brand-soft);color:var(--brand);font-weight:600;border-radius:7px;padding:3px 8px;margin:2px 3px 2px 0;cursor:pointer;font-size:12.5px}
.strip-row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;width:100%;border:0;border-top:1px solid #f0ece7;background:none;padding:9px 0;cursor:pointer;font-size:13.5px;text-align:left}
.strip-row:first-child{border-top:0}
.strip-row.sel{font-weight:700}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;min-width:62px;text-align:center}
.pill.free{background:var(--ok-bg);color:var(--ok)}
.pill.hold{background:var(--warn-bg);color:var(--warn)}
.pill.booked{background:var(--bad-bg);color:var(--bad)}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.day{border:1px solid #efebe6;background:#fff;border-radius:9px;padding:5px 4px 6px;min-height:58px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left}
.day .dn{font-size:12px;font-weight:600}
.day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.day.past{opacity:.55}
.day .hb{height:7px;border-radius:3px;background:#e7f3eb}
.day .hb.hold{background:#f1bf5b}
.day .hb.booked{background:#d65a4b}
.day.blank{visibility:hidden}

/* payments */
.pay{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.prog{height:8px;background:#f1ede8;border-radius:4px;overflow:hidden;margin:9px 0 6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:flex-end;background:rgba(20,16,14,.45)}
.sheet-panel{width:100%;max-width:560px;max-height:94dvh;background:#fff;border-radius:20px 20px 0 0;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(20px);opacity:.6;transition:transform .18s ease,opacity .18s ease}
#sheet.open .sheet-panel{transform:none;opacity:1}
.sheet-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
form label{display:block;font-size:12.5px;font-weight:600;color:#4c4743;margin-bottom:11px}
form input:not([type=checkbox]):not([type=radio]),form select,form textarea{display:block;width:100%;margin-top:5px;border:1px solid #dcd6cf;border-radius:10px;padding:10px 11px;font-size:15px;font-weight:400;background:#fff;color:var(--ink)}
form input:disabled{background:#f5f2ee;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex!important;align-items:center;gap:8px;border:1px solid #dcd6cf;border-radius:10px;padding:10px 11px;font-weight:500!important;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
fieldset{border:0;padding:0;margin:0 0 6px}
legend{font-size:12.5px;font-weight:600;color:#4c4743;margin-bottom:6px;padding:0}
.hopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hopt{display:flex;align-items:center;gap:8px;border:1.5px solid #dcd6cf;border-radius:10px;padding:9px 10px;cursor:pointer;font-size:14px}
.hopt input{accent-color:var(--brand);width:17px;height:17px;margin:0}
.hopt small{display:block;font-size:11px;font-weight:700}
.hopt.free small{color:var(--ok)}
.hopt.hold small{color:var(--warn)}
.hopt.booked small{color:var(--bad)}
.hopt.dis{opacity:.5;cursor:not-allowed;background:#faf8f5}
.hopt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0 12px;line-height:1.45}
.alert.bad{background:var(--bad-bg);color:var(--bad)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--info-bg);color:var(--info)}
.alert button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.sep{height:1px;background:var(--line);margin:6px 0 14px}
.box{background:#faf8f5;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.box h3{margin-top:0}
.prow{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #eee9e3}
.addpay{display:grid;grid-template-columns:1fr 92px auto;gap:6px;align-items:end;margin-top:10px}
.addpay input,.addpay select{margin-top:0!important}
.note{font-size:13px;border-left:3px solid var(--line);padding:3px 0 3px 10px;margin:8px 0}
.note small{display:block;color:var(--muted);font-size:11.5px}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:-20px;background:#fff;padding:12px 0 4px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#221d1b;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}
.foot{text-align:center;margin:18px 0 6px}
@media (max-width:380px){.money b{font-size:14px}.stat b{font-size:22px}.halls .hall .hs{font-size:15px}}
</style>
</head>
<body>

<div id="calc" aria-label="Calculator">
  <div class="calc-wrap">
    <div class="calc-display">
      <div class="calc-expr" id="cExpr"></div>
      <div class="calc-out" id="cOut">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="key fn" data-k="AC">AC</button>
      <button class="key fn" data-k="DEL" aria-label="Delete">⌫</button>
      <button class="key fn" data-k="%">%</button>
      <button class="key op" data-k="/">÷</button>
      <button class="key" data-k="7">7</button>
      <button class="key" data-k="8">8</button>
      <button class="key" data-k="9">9</button>
      <button class="key op" data-k="*">×</button>
      <button class="key" data-k="4">4</button>
      <button class="key" data-k="5">5</button>
      <button class="key" data-k="6">6</button>
      <button class="key op" data-k="-">−</button>
      <button class="key" data-k="1">1</button>
      <button class="key" data-k="2">2</button>
      <button class="key" data-k="3">3</button>
      <button class="key op" data-k="+">+</button>
      <button class="key zero" data-k="0">0</button>
      <button class="key" data-k=".">.</button>
      <button class="key eq" data-k="=">=</button>
    </div>
  </div>
</div>

<div id="app" hidden>
  <div class="shell">
    <header class="top">
      <div class="brand"><b>Evara</b><span>Banquet CRM</span></div>
      <span class="who" id="who"></span>
      <button class="icon-btn" data-act="lock" aria-label="Lock" title="Lock"></button>
    </header>
    <main id="main"></main>
    <button class="fab" data-act="newLead" aria-label="New enquiry"></button>
    <nav class="tabs" id="tabs"></nav>
  </div>
</div>

<div id="sheet" hidden><div class="sheet-panel" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
